; Process supervision for the all-in-one bundle.
;
; IMPORTANT: hosts like Render set a global $PORT for the single public service.
; Only the copilot may inherit it. The internal services get a pinned PORT so
; the host's value cannot leak in and collide with the copilot's listen port.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:prometheus]
command=/usr/local/bin/prometheus
    --config.file=/etc/prometheus/prometheus.yml
    --storage.tsdb.path=/tmp/prometheus
    --storage.tsdb.retention.time=1h
    --web.listen-address=127.0.0.1:9090
    --web.route-prefix=/prometheus
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:payment-service]
command=python /app/services/payment-service/app.py
directory=/app
environment=PORT="5002"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:order-service]
command=python /app/services/order-service/app.py
directory=/app
environment=PORT="5001",PAYMENT_URL="http://127.0.0.1:5002/pay"
priority=21
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:loadgen]
command=python /app/loadgen.py
directory=/app
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; inherits the host's $PORT (Render default 10000, or 8000 when unset)
[program:copilot]
command=python -m dashboard.app
directory=/app
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
